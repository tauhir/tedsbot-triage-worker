[project]
name = "tedsbot-triage-worker"
version = "0.1.0"
description = "Autonomous bug-triage and fix worker on the Claude Agent SDK."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "claude-agent-sdk>=0.2.150,<0.3",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
tedsbot = "tedsbot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.6",
    "vcrpy>=6.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tedsbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["e2e: real-service tests, require TEDSBOT_E2E=1"]

[tool.ruff]
line-length = 88
target-version = "py312"
